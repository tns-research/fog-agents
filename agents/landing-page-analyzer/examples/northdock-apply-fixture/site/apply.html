<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply to Northdock (test fixture)</title>
<link rel="stylesheet" href="style.css">
<!-- Test fixture for landing-page-analyzer: planted form defects. Northdock is a fictional accelerator. -->
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="index.html">Northdock</a>
  </header>
  <h1 style="font-size:32px;margin:16px 0 8px">Apply to Northdock</h1>
  <p style="margin:0 0 24px;color:#c0c1c6">Tell us who you are and what you are building. The team reads every application.</p>
  <form class="apply" id="apply" novalidate>
    <div>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="text" required>
    </div>
    <div>
      <input id="phone" name="phone" type="text" placeholder="Phone">
    </div>
    <div>
      <label for="startup">Startup name</label>
      <input id="startup" name="startup" type="text">
    </div>
    <div>
      <label for="building">What are you building?</label>
      <textarea id="building" name="building" rows="3"></textarea>
    </div>
    <div id="status"></div>
    <button type="submit" id="send">Send application</button>
  </form>
</div>
<script>
  var form = document.getElementById('apply');
  function setError(id, text) {
    var input = document.getElementById(id);
    var old = document.getElementById(id + '-error');
    if (old) old.remove();
    input.removeAttribute('aria-invalid');
    if (!text) return;
    input.setAttribute('aria-invalid', 'true');
    var p = document.createElement('p');
    p.className = 'error'; p.id = id + '-error'; p.setAttribute('role', 'alert'); p.textContent = text;
    input.insertAdjacentElement('afterend', p);
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = form.name.value.trim(), email = form.email.value.trim();
    setError('name', name ? '' : 'Enter your full name.');
    setError('email', /.+@.+\..+/.test(email) ? '' : 'Enter an email address like name@example.com.');
    if (!name || !/.+@.+\..+/.test(email)) return;
    var button = document.getElementById('send');
    button.textContent = 'Sending...'; button.disabled = true;
    var data = { name: name, email: email, phone: form.phone.value, startup: form.startup.value, building: form.building.value };
    fetch('/api/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); document.getElementById('status').innerHTML = '<p class="notice">Thanks, application received.</p>'; })
      .catch(function () { document.getElementById('status').innerHTML = '<p class="notice" role="alert">Could not send your application. Please try again.</p>'; button.textContent = 'Send application'; button.disabled = false; });
  });
</script>
</body>
</html>
